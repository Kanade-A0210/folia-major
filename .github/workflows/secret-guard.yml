# LOCAL FORK SAFETY —— 密钥泄漏拦截（不对上游仓库生效）
#
# 为什么需要这个：
# 上游 chthollyphile/folia-major 的 12 个 workflow 里没有密钥扫描，
# 本地 pre-commit / pre-push hook 又可被 --no-verify 等方式绕过。
# 这道 CI 是最后一道网——hook 漏掉的密钥，这里再拦一次。
#
# 用 GitHub 原生 secret scanning API（无需第三方 action、无需外部密钥）：
#   - 已开启该功能的仓库：任何新推送的密钥都会自动出现在 Security 页并阻断
#   - 未开启的仓库：step 2 的轻量正则扫描仍然生效
#
# 若要在 Settings → Code security 开启原生扫描：
#   打开 "Secret scanning" 与 "Push protection"。
#   Push protection 会在 push 时直接拒绝含密钥的提交，
#   相当于把本地 hook 的能力搬到服务端，绕不过去。

name: Secret Guard

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard against committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 注：GitHub 原生 secret scanning 需要 PAT（内置 GITHUB_TOKEN 无该 API 权限），
      # 而本仓库不引入额外凭据，故此处不调用该 API。
      # 原生扫描已由Settings → Code security → Secret scanning 承担（若用户开启），
      # 本 workflow 负责它不覆盖的类型（DashScope/ark/百炼等）。
      #
      # ---- 第一道：扫本次新增内容里的密钥特征 ----
      # 覆盖本地 hook 的同一批特征，外加私钥 PEM 头与常见云厂商 key 格式
      - name: Scan added lines for secret patterns
        run: |
          set -euo pipefail

          BASE="origin/${{ github.base_ref || 'main' }}"
          HEAD_SHA="${{ github.event.after || github.sha }}"

          # PR 用三点 diff，push 用两点diff；都只取新增行
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${BASE}...${HEAD_SHA}"
          else
            # 首个提交没有父节点，退化为检查该提交全部内容
            if git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
              RANGE="${HEAD_SHA}^..${HEAD_SHA}"
            else
              RANGE="${HEAD_SHA}"
            fi
          fi

          git fetch --no-tags --depth=50 origin "${{ github.base_ref || 'main' }}" || true

          #只扫新增行（以 + 开头，排除+++ 的文件头）
          ADDED=$(git diff $RANGE 2>/dev/null | grep -E '^\+' | grep -vE '^\+\+\+' || true)

          if [ -z "$ADDED" ]; then
            echo "本次提交无新增内容，跳过。"
            exit 0
          fi

          echo "扫描本次新增 $(printf '%s\n' "$ADDED" | wc -l | tr -d ' ') 行…"

          FAILED=0
          check() {
            local label="$1" pattern="$2"
            # shellcheck disable=SC2001
            if printf '%s\n' "$ADDED" | grep -nE "$pattern" > /tmp/hits.txt 2>/dev/null; then
              echo ""
              echo "⚠️  命中疑似密钥：${label}"
              sed 's/^/     /' /tmp/hits.txt | cut -c1-160
              FAILED=1
            fi
          }

          check "阿里云 DashScope"  'sk-ws-[A-Za-z0-9._-]{20,}'
          check "阿里云 ark"        'ark-[a-zA-Z0-9]{20,}'
          check "OpenAI"          'sk-[A-Za-z0-9]{32,}'
          check "Anthropic"       'sk-ant-[A-Za-z0-9_-]{20,}'
          check "Google API"     'AIza[0-9A-Za-z_-]{30,}'
          check "GitHub PAT"     'gh[pousr]_[A-Za-z0-9]{30,}'
          check "Slack"          'xox[baprs]-[A-Za-z0-9-]{10,}'
          check "私钥 PEM"        '-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
          check "AWS Access Key" 'AKIA[0-9A-Z]{16}'
          check "Stripe"         '[sr]k_live_[0-9a-zA-Z]{20,}'

          if [ "$FAILED" != "0" ]; then
            echo ""
            echo "════════════════════════════════════════════════"
            echo " 提交被拦截：新增内容中检测到疑似密钥。"
            echo ""
            echo " 本 fork 为公开仓库，密钥进入历史后极难彻底清除。"
            echo " 处置顺序："
            echo "   1. 先到服务商控制台吊销该密钥（最重要，清理历史不能替代）"
            echo "   2. 用 git rebase -i 或 filter-branch 从历史中移除"
            echo "   3. 强推（仅在密钥已失效的前提下才有意义）"
            echo "════════════════════════════════════════════════"
            exit 1
          fi

          echo "✓ 未发现密钥特征。"

      # ---- 第二道：敏感文件存在性检查 ----
      - name: Fail if secret-bearing files are tracked
        run: |
          set -euo pipefail
          BAD=$(git ls-files | grep -E '(^|/)\.env(\.|$)|\.dev-credentials/|\.pem$|\.p12$|\.key$' || true)
          if [ -n "$BAD" ]; then
            echo ""
            echo "════════════════════════════════════════════════"
            echo " 仓库中存在不应被跟踪的敏感文件："
            for f in $BAD; do echo "   - $f"; done
            echo ""
            echo " 处理："
            echo "   git rm --cached <文件>        # 移出索引但保留本地"
            echo "   echo '<文件>' >> .gitignore  # 避免再次误提交"
            echo "════════════════════════════════════════════════"
            exit 1
          fi
          echo "✓ 无被跟踪的敏感文件。"